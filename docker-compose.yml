version: '3.8'

services:
  gateway:
    image: php:8.4-cli
    container_name: microservice_gateway
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    environment:
      - MICROSERVICE_GATEWAY_MODE=http
      - IDENTITY_SERVICE_URL=http://identity:8001
      - ATTENDANCE_SERVICE_URL=http://attendance:8002
      - PAYROLL_SERVICE_URL=http://payroll:8003
      - ACCOUNTING_SERVICE_URL=http://accounting:8004
      - INVENTORY_SERVICE_URL=http://inventory:8005
      - NOTIFICATION_SERVICE_URL=http://notification:8006
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - identity
      - attendance
      - payroll
      - accounting
      - inventory
      - notification

  identity:
    image: php:8.4-cli
    container_name: microservice_identity
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8001:8001"
    command: php artisan serve --host=0.0.0.0 --port=8001

  attendance:
    image: php:8.4-cli
    container_name: microservice_attendance
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8002:8002"
    command: php artisan serve --host=0.0.0.0 --port=8002

  payroll:
    image: php:8.4-cli
    container_name: microservice_payroll
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8003:8003"
    command: php artisan serve --host=0.0.0.0 --port=8003

  accounting:
    image: php:8.4-cli
    container_name: microservice_accounting
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8004:8004"
    command: php artisan serve --host=0.0.0.0 --port=8004

  inventory:
    image: php:8.4-cli
    container_name: microservice_inventory
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8005:8005"
    command: php artisan serve --host=0.0.0.0 --port=8005

  notification:
    image: php:8.4-cli
    container_name: microservice_notification
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8006:8006"
    command: php artisan serve --host=0.0.0.0 --port=8006

